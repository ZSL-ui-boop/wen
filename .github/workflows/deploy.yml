# push 到 main 后自动构建并 SSH 部署到服务器
# GitHub 仓库 Settings → Secrets and variables → Actions 中配置：
#   SERVER_HOST, SERVER_USER, SERVER_PRIVATE_KEY, DEPLOY_PATH
#   VITE_API_BASE_URL（可选，Repository variables）
name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: free-fs-frontend-master/pnpm-lock.yaml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build frontend
        working-directory: free-fs-frontend-master
        run: |
          pnpm install --frozen-lockfile
          pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://localhost:8081' }}

      - name: Build backend
        working-directory: free-fs-master
        run: mvn -B clean package -DskipTests

      - name: Prepare deploy bundle
        run: |
          mkdir -p deploy-output/frontend deploy-output/backend deploy-output/deploy
          cp -r free-fs-frontend-master/dist/* deploy-output/frontend/
          cp free-fs-master/fs-admin/target/fs-admin.jar deploy-output/backend/
          cp deploy/deploy.sh deploy/ecosystem.config.cjs deploy-output/deploy/

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_PRIVATE_KEY: ${{ secrets.SERVER_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for var in SERVER_HOST SERVER_USER SERVER_PRIVATE_KEY DEPLOY_PATH; do
            if [ -z "${!var}" ]; then
              echo "缺少 Secret: $var"
              exit 1
            fi
          done

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_PRIVATE_KEY" > ~/.ssh/id_rsa
          sed -i 's/\r$//' ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/id_rsa -p "$SERVER_PORT" -o StrictHostKeyChecking=no \
            "$SERVER_USER@$SERVER_HOST" "mkdir -p '$DEPLOY_PATH/release'"

          scp -i ~/.ssh/id_rsa -P "$SERVER_PORT" -o StrictHostKeyChecking=no -r \
            deploy-output/frontend deploy-output/backend deploy-output/deploy \
            "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/release/"

          ssh -i ~/.ssh/id_rsa -p "$SERVER_PORT" -o StrictHostKeyChecking=no \
            "$SERVER_USER@$SERVER_HOST" "bash '$DEPLOY_PATH/release/deploy/deploy.sh'"
