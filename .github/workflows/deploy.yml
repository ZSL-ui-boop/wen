# push 到 main 后自动构建并 SSH 部署到服务器
# GitHub 仓库 Settings → Secrets and variables → Actions 中配置：
#   SERVER_HOST, SERVER_USER, SERVER_PRIVATE_KEY, DEPLOY_PATH
#   VITE_API_BASE_URL（可选，Repository variables）
name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: free-fs-frontend-master/pnpm-lock.yaml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build frontend
        working-directory: free-fs-frontend-master
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://localhost:8081' }}

      - name: Build backend
        working-directory: free-fs-master
        run: mvn -B clean package -DskipTests

      - name: Prepare deploy bundle
        run: |
          mkdir -p deploy-output/frontend deploy-output/backend deploy-output/deploy
          cp -r free-fs-frontend-master/dist/* deploy-output/frontend/
          cp free-fs-master/fs-admin/target/fs-admin.jar deploy-output/backend/
          cp deploy/deploy.sh deploy/ecosystem.config.cjs deploy-output/deploy/

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          source: deploy-output/frontend,deploy-output/backend,deploy-output/deploy
          target: ${{ secrets.DEPLOY_PATH }}/release
          strip_components: 1

      - name: Run deploy script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          script: bash ${{ secrets.DEPLOY_PATH }}/release/deploy/deploy.sh
