name: free-fs 项目自动部署
on:
  push:
    branches:
      - main  # 你的主分支

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - name: 拉取代码
        uses: gitee/checkout@v2

      # 2. 构建前端
      - name: 构建 free-fs-frontend-master
        run: |
          cd free-fs-frontend-master
          npm install
          npm run build
          cd ..

      # 3. 构建后端
      - name: 构建 free-fs-master
        run: |
          cd free-fs-master
          mvn clean package -Dmaven.test.skip=true
          cd ..

      # 4. 部署到服务器
      - name: 部署到服务器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          script: |
            # 服务器上的项目路径，改成你自己的
            cd /www/wwwroot/your-project
            # 拉取最新代码
            git pull origin main
            # 部署前端
            cd free-fs-frontend-master
            npm install
            npm run build
            # 部署后端
            cd ../free-fs-master
            mvn clean package -Dmaven.test.skip=true
            # 重启后端服务（根据你的实际情况修改）
            pm2 restart free-fs