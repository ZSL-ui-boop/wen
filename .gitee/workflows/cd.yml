# 手动触发：构建 Docker 镜像（需自行配置 Registry 推送 secrets）
name: CD

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to registry (requires secrets)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  IMAGE_NAME: free-fs

jobs:
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package backend
        working-directory: free-fs-master
        run: mvn -B clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: inputs.push_image == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: free-fs-master
          file: free-fs-master/docker/Dockerfile
          push: ${{ inputs.push_image == 'true' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
