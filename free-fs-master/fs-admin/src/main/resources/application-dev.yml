# 本机若已有进程占满 8080，开发环境改用 8081，避免 mvn spring-boot:run 反复失败；前端需指向同一端口（见 free-fs-frontend .env.development）
server:
  port: 8081

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://127.0.0.1:3306/free-fs?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    # postgresql数据库配置
#    url: jdbc:postgresql://127.0.0.1:5432/free-fs?useUnicode=true&characterEncoding=utf8&useSSL=true&autoReconnect=true&reWriteBatchedInserts=true
#    username: postgres
#    password: postgres
#    driver-class-name: org.postgresql.Driver
    # 数据源配置
    hikari:
      # 最大连接池数量
      maximum-pool-size: 20
      # 最小空闲线程数量
      minimum-idle: 10
      # 配置获取连接等待超时的时间
      connectionTimeout: 30000
      # 校验超时时间
      validationTimeout: 5000
      # 空闲连接存活最大时间，默认10分钟
      idleTimeout: 600000
      # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
      maxLifetime: 1800000
      # 连接测试query（配置检测连接是否有效）
      connectionTestQuery: SELECT 1
      # 多久检查一次连接的活性
      keepaliveTime: 30000
  data:
    redis:
      # 与本机默认一致：127.0.0.1:6379、无密码（Windows 本地 Redis / Memurai 常见）
      # 若你的 Redis 有密码或不在本机，用环境变量覆盖（与 Spring Boot 一致）：
      #   SPRING_DATA_REDIS_HOST  SPRING_DATA_REDIS_PORT  SPRING_DATA_REDIS_PASSWORD
      # 也可复制 set-redis-env.example.cmd 为 set-redis-env.cmd 后修改，再在启动脚本里 call。
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: 0
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数f
          max-active: 200
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池中的最小空闲连接
          min-idle: 0
  cache:
    # 缓存类型 redis、none(不使用缓存)
    type: redis
    # 缓存时间(单位：ms)
    redis:
      time-to-live: 3600000
      # 缓存null值，防止缓存穿透
      cache-null-values: true
  # --- 邮件：收不到验证码时，必须配置真实 SMTP（见 application.yml 的 spring.mail）---
  # 默认仓库里的 password 是占位符；请用环境变量（推荐 set-mail-env.example.cmd）或在此取消下行注释并填写。
  # dev 下打开 JavaMail 调试，控制台会打印 AUTH、MAIL FROM 等与 QQ 服务器的交互，便于排查。
  mail:
    enable: true
    properties:
      mail:
        debug: true
    # 若不用环境变量，可取消下面三行注释并填写（勿把真密码提交到 Git）
    # username: 你的QQ号@qq.com
    # password: QQ邮箱SMTP授权码
    # form: "Free-Fs <你的QQ号@qq.com>"

fs:
  # 开发环境：邮件发出成功后仍在控制台打印登录验证码，便于本地调试（生产务必为 false 或删除此项）
  mail:
    log-verification-code: true
  # 前端地址
  frontend:
    domain: ${FS_FRONTEND_DOMAIN:http://localhost:5173}
  # 预览配置
  preview:
    # 预览文件流处理地址，默认是本服务地址,端口号
    stream-api: http://localhost:${server.port}/api/file/stream/preview
    # 预览文件最大大小（字节），默认500MB
    max-file-size: 524288000
    # 单次Range请求最大大小（字节），默认10MB
    # 用于视频/音频的分片传输，防止内存溢出
    max-range-size: 10485760
    # 小文件直接传输阈值（字节），默认10MB
    # 小于此大小的文件将一次性读取到内存
    small-file-size: 10485760
    # 缓冲区大小（字节），默认8KB
    buffer-size: 8192
    office:
      # 多次启动后端时，旧的 soffice.bin 常占用 127.0.0.1:2002，导致 JOD 启动失败。
      # 需要 Word/Excel 转 PDF 在线预览时改为 true，并先运行 scripts/stop-backend-8080.ps1（建议管理员）或结束 soffice 进程。
      enabled: false
      #LibreOffice 安装路径
      # Linux: /usr/lib/libreoffice
      # Windows: C:/Program Files/LibreOffice
      # Mac: /Applications/LibreOffice.app/Contents
      office-home: C:/Users/张帅磊/Desktop/2/free-fs-master/LibreOffice
      task-execution-timeout: 120000
      task-queue-timeout: 30000
      max-tasks-per-process: 200
      cache-path: ${java.io.tmpdir}/office-convert

  # 本地存储配置（默认）
  # 勿写死 D: 盘路径：无 D 盘或目录不可写时，分片初始化会失败，前端仅显示「文件校验失败」
  # 可用环境变量覆盖：FS_LOCAL_STORAGE_BASE
  storage:
    local:
      base-path: ${FS_LOCAL_STORAGE_BASE:${user.home}/free-fs-upload}
      base-url: http://localhost:${server.port}/files

# AI：本机密钥写在 application-local.yml（已 gitignore）；或设环境变量 AI_ENABLED / AI_API_KEY / AI_BASE_URL / AI_MODEL

mybatis-flex:
  # sql审计
  audit_enable: true
  # sql打印
  sql_print: true
